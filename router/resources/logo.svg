<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006837" />
      <stop offset="50%" stop-color="#009640" />
      <stop offset="100%" stop-color="#054A29" />
    </linearGradient>
  </defs>

  <!-- Background container for high clarity -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" />

  <!-- Overlapping Triquetra Circles -->
  <!-- Top Circle -->
  <circle cx="50" cy="36" r="23" fill="none" stroke="url(#circleGrad)" stroke-width="2.8" opacity="0.9" />
  <!-- Bottom Left Circle -->
  <circle cx="36" cy="58" r="23" fill="none" stroke="url(#circleGrad)" stroke-width="2.8" opacity="0.9" />
  <!-- Bottom Right Circle -->
  <circle cx="64" cy="58" r="23" fill="none" stroke="url(#circleGrad)" stroke-width="2.8" opacity="0.9" />

  <!-- Inner Interlocking Curves -->
  <path d="M 50 36 A 23 23 0 0 1 64 58 A 23 23 0 0 1 36 58 A 23 23 0 0 1 50 36" fill="none" stroke="#00875A" stroke-width="1.8" opacity="0.6" />

  <!-- Central Neural Graph Network -->
  <!-- Central Hub -->
  <circle cx="50" cy="51" r="3" fill="#031B4E" />

  <!-- Branching Lines to Node Centers -->
  <line x1="50" y1="51" x2="55" y2="30" stroke="#031B4E" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="51" x2="28" y2="60" stroke="#031B4E" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="51" x2="68" y2="67" stroke="#031B4E" stroke-width="2.5" stroke-linecap="round" />

  <!-- Outer Nodes -->
  <circle cx="55" cy="30" r="4.2" fill="#031B4E" />
  <circle cx="28" cy="60" r="4.2" fill="#031B4E" />
  <circle cx="68" cy="67" r="4.2" fill="#031B4E" />
</svg>
